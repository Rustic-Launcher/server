name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path plugins/Cargo.toml --all --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build official plugins (wasm32-wasip2)
        run: cargo build --manifest-path plugins/Cargo.toml --workspace --target wasm32-wasip2 --release
      - name: Clippy (plugins)
        run: cargo clippy --manifest-path plugins/Cargo.toml --workspace --target wasm32-wasip2 -- -D warnings
      - name: Tests (workspace, uses the built plugins as fixtures)
        run: cargo test --workspace

  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --manifest-path plugins/Cargo.toml --workspace --target wasm32-wasip2 --release
      - name: Benchmarks compile and run once
        run: cargo bench --workspace -- --test

  server:
    # Builds rustic-server against the pinned Horizon submodule and checks the patches apply.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/rusticmc-server -> ../../horizon/target
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - run: python3 scripts/patches.py check
      - run: python3 scripts/sync_horizon.py --check
      - run: cargo clippy --manifest-path crates/rusticmc-server/Cargo.toml --all-targets -- -D warnings
        env:
          CARGO_TARGET_DIR: horizon/target
      - run: cargo test --manifest-path crates/rusticmc-server/Cargo.toml
        env:
          CARGO_TARGET_DIR: horizon/target

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
