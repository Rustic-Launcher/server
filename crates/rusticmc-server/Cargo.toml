# rustic-server: Horizon's dedicated engine with Rustic linked in as its one trait mod.
#
# Its own workspace (excluded from the root one): it links `horizon-client`, so it must build with
# Horizon's `[patch.crates-io]` and Horizon's Cargo.lock versions. `python scripts/sync_horizon.py`
# rewrites the generated block at the end of this file and seeds Cargo.lock; `--check` in CI.
#
# Build with the shared target dir so Horizon is compiled once (AGENTS.md):
#   CARGO_TARGET_DIR=<repo>/horizon/target cargo build --manifest-path crates/rusticmc-server/Cargo.toml --profile fast
[workspace]
resolver = "2"

[package]
name = "rusticmc-server"
description = "rustic-server: the Horizon dedicated engine with the Rustic plugin platform"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
publish = false
default-run = "rustic-server"

[[bin]]
name = "rustic-server"
path = "src/main.rs"

[dependencies]
# The game. `default-features = false` is the server build Horizon releases as `horizon-engine`
# (no audio, no controllers, no Horizon extras; docs/horizon/build.md).
horizon-client = { path = "../../horizon/crates/horizon-client", default-features = false }
# `horizon_mods::api_level::MARK`: the mod API level, kept in the executable for the launcher and
# the supervisor to read. Same features as horizon-client asks for, so the crate is built once.
horizon-mods = { path = "../../horizon/crates/horizon-mods", default-features = false, features = ["index"] }
# The game's allocator (mimalloc), as horizon-client's own executable uses.
horizon-threads = { path = "../../horizon/crates/horizon-threads" }
# SNBT text for item components (rustic's `item-stack.components`), as horizon-client has it.
horizon-world = { path = "../../horizon/crates/horizon-world" }
rusticmc-core = { path = "../rusticmc-core" }
rusticmc-host = { path = "../rusticmc-host" }
# Rustic Bridge (feature `bridge`): Bukkit/Paper plugin jars of plugins/bukkit/ in a JVM sidecar.
# The bridge's Java layer is a separate GPL-3.0-only program reached over a socket (ADR 0009).
rusticmc-bridge = { path = "../../bridge/rusticmc-bridge", optional = true }
log = "0.4"
serde_json = "1"

[features]
default = ["bridge"]
## Load Bukkit/Paper plugins from plugins/bukkit/*.jar through Rustic Bridge (docs/BRIDGE.md).
## On by default: a server without plugin jars never starts a JVM. `--no-default-features` drops it.
bridge = ["dep:rusticmc-bridge"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

# Horizon's profiles, copied so artefacts in the shared target dir are the same ones Horizon's
# own builds make (horizon/Cargo.toml).
[profile.dev]
debug = "line-tables-only"
[profile.dev.package.horizon-mod-api-gen]
opt-level = 3
[profile.dev.package.syn]
opt-level = 3
[profile.dev.package.proc-macro2]
opt-level = 3
[profile.release.package.horizon-mod-api-gen]
opt-level = 3
[profile.release.package.syn]
opt-level = 3
[profile.release.package.proc-macro2]
opt-level = 3
[profile.release]
lto = "thin"
codegen-units = 1
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# BEGIN horizon-patch
# Generated by scripts/sync_horizon.py from horizon/Cargo.toml: do not edit.
[patch.crates-io]
wgpu-hal = { path = "../../horizon/third_party/wgpu-hal" }
naga = { path = "../../horizon/third_party/naga" }
libmimalloc-sys = { path = "../../horizon/third_party/libmimalloc-sys" }
# END horizon-patch
