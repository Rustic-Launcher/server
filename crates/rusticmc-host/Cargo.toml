[package]
name = "rusticmc-host"
description = "Wasmtime component runtime for Rustic plugins: sandboxing, imports, async instances, services"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rusticmc-core = { path = "../rusticmc-core" }
rusticmc-api-wit = { path = "../rusticmc-api-wit" }
wasmtime = { version = "50.0.1", default-features = false, features = [
    "std",
    "runtime",
    "cranelift",
    "component-model",
    "cache",
    "parallel-compilation",
    "pooling-allocator",
    "backtrace",
    "addr2line",
    "demangle",

] }
wasmtime-wasi = { version = "50.0.1", default-features = false, features = ["p2"] }
ureq = { version = "3.5.1", default-features = false, features = ["rustls", "gzip"] }
sha2 = "0.10"
log = "0.4.35"
thiserror = "2.0.21"
bytes = "1.11"
tokio = { version = "1.51", default-features = false }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3.27.0"

[lints]
workspace = true

[[bench]]
name = "host"
harness = false
