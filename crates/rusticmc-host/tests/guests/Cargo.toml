# Guest components used only by rusticmc-host's integration tests and benches (not shipped).
# Own workspace: the economy provider enables the SDK's `provide-economy` feature, which must
# not unify with ordinary plugins, so each package is built with its own `cargo build -p`:
#   CARGO_TARGET_DIR=plugins/target cargo build --release --target wasm32-wasip2 \
#     --manifest-path crates/rusticmc-host/tests/guests/Cargo.toml -p guest-probe
#   (then the same with -p guest-economy). The tests do this themselves.
[workspace]
resolver = "2"
members = ["probe", "economy"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
debug = false
