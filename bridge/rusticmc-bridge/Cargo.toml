[package]
name = "rusticmc-bridge"
description = "Rustic Bridge runtime: runs Bukkit/Paper plugins in a supervised JVM sidecar and plugs them into rusticmc-core as plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The Java layer (bridge/java, GPL-3.0-only) is a separate program this crate starts and talks to
# over a socket; nothing here links or embeds it (ADR 0009).

[dependencies]
rusticmc-core = { path = "../../crates/rusticmc-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
semver = "1.0.28"
log = "0.4.35"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
