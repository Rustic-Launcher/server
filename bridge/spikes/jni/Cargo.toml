[package]
name = "rusticmc-bridge-jni-spike"
description = "Spike: the Rustic Bridge Java layer in an embedded JVM (JNI), measured against the sidecar"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace: a measurement program, not part of Rustic (docs/BRIDGE.md, ADR 0040).
#   CARGO_TARGET_DIR=<repo>/target cargo run --release --manifest-path bridge/spikes/jni/Cargo.toml
[workspace]

[dependencies]
jni = { version = "0.22.4", features = ["invocation"] }
serde_json = "1"
tempfile = "3"
