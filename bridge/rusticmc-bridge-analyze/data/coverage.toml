# Rustic coverage of the Bukkit / Spigot / Paper / Adventure plugin API.
#
# Built by hand from the WIT contract (crates/rusticmc-api-wit/wit/*.wit, rustic:api@0.1.0 and
# rustic:services@0.1.0). Only names of public API types and members appear here (facts needed
# for interoperability analysis); no code, signature or documentation text is copied from any
# Bukkit-family project (AGENTS.md).
#
# Format (see src/coverage.rs):
#   [packages]               "a.b.c" = mapping       every class under that package prefix
#   [classes."a.b.C"]        type = mapping           the type itself (absent: see members)
#                            inherits = ["a.b.D"]     supertypes/delegates whose mappings apply
#   [classes."a.b.C".methods] name = mapping          by name, or "name(descriptor)", or "*"
#   [classes."a.b.C".fields]  name = mapping
#
# Mapping values: "iface.function" (WIT), "events.<record>" (an event handler), "java-side: ..."
# (pure-Java API the bridge implements without any host call), "partial: ..." (covered with a
# semantic gap: counted as covered, reported separately) and "uncovered: why" (explicit gap).
# Anything absent is uncovered. A unit test checks that every `iface.function` named here exists
# in the WIT, so this table cannot claim more than the contract offers.

[meta]
api = "rustic:api@0.1.0 + rustic:services@0.1.0"
note = "Hand-written from the WIT; be conservative: absent means uncovered."

# ------------------------------------------------------------------ whole packages (pure Java)

[packages]
"org.bukkit.configuration" = "java-side: YAML configuration, files in the plugin data folder (wasi:filesystem data-folder for native plugins)"
"org.bukkit.util.noise" = "java-side: noise generators (pure maths)"
"org.bukkit.metadata" = "java-side: metadata values held by the bridge"
"org.bukkit.util.io" = "partial: java-side object streams; ItemStack values go through types.item-stack SNBT"
"net.kyori.adventure.text" = "java-side: Adventure components and MiniMessage, serialized to types.text JSON"
"net.kyori.adventure.key" = "java-side: namespaced keys"
"net.kyori.adventure.util" = "java-side"
"net.kyori.adventure.title" = "java-side: title values, shown with players.send-title"
"net.kyori.adventure.sound" = "java-side: sound values, played with players.play-sound"
"net.kyori.adventure.identity" = "java-side"
"net.kyori.adventure.pointer" = "java-side"
"net.kyori.adventure.nbt" = "java-side: NBT values"
"net.kyori.adventure.translation" = "partial: java-side; the client renders translatable components, the server-side registry is not exposed"
"net.kyori.examination" = "java-side"
"net.kyori.option" = "java-side"
"net.md_5.bungee.api.chat" = "java-side: BungeeCord chat components, serialized to types.text JSON"
"net.md_5.bungee.chat" = "java-side: chat component serializer"
"com.mojang.brigadier" = "partial: java-side Brigadier tree, registered as commands.register usages (argument kinds limited to commands.arg-kind)"

