# Test fixture for essentials-lite's integration tests (not shipped): an economy provider whose
# accounts start with 150 coins. Its own workspace, so the SDK's `provide-economy` feature never
# unifies with the plugins workspace; `rusticmc_test::build_plugin` builds it on demand.
[package]
name = "ess-test-economy"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rustic = { package = "rusticmc-api", path = "../../../../../crates/rusticmc-api", features = ["provide-economy"] }

[workspace]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
