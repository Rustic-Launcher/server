# Rustic plugin manifest (docs/PLUGIN_FORMAT.md).
[plugin]
id = "mini-game"
name = "Mini-game"
version = "0.1.0"
api = "0.1"
authors = ["Rustic contributors"]
license = "MIT OR Apache-2.0"
entry = "mini_game.wasm"
description = "Arena mini-games (Spleef, King of the Hill): lobby countdown, boss bar, live sidebar, world changes, stats and rewards."

[capabilities]
# config.toml lives in the data folder.
filesystem = "data-folder"
